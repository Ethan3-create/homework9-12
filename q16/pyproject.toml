[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greetlab-25020007025"
version = "0.1.0"

[project.scripts]
sdt-greet = "greetlab.cli:main"

# ---- 第 13 题：本地质量门禁最小配置 ----
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
